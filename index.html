
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind - Lost & Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CampusFind</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#report">Report Item</a>
      <a href="#items">Browse Items</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h2>Lost Something? Find It Here.</h2>
      <p>A simple lost and found portal for college students.</p>
      <input id="search" placeholder="Search for an item...">
    </section>

    <section id="report">
      <h2>Report a Lost or Found Item</h2>
      <form id="itemForm">
        <input id="name" placeholder="Item name" required>

        <select id="type">
          <option value="Lost">Lost Item</option>
          <option value="Found">Found Item</option>
        </select>

        <input id="category" placeholder="Category" required>
        <input id="location" placeholder="Location" required>
        <input id="date" type="date" required>
        <textarea id="description"
          placeholder="Item description" required></textarea>

        <button type="submit">Submit Report</button>
      </form>
      <p id="message"></p>
    </section>

    <section id="items">
      <h2>Reported Items</h2>
      <div id="itemList" class="items"></div>
    </section>
  </main>

  <footer>
    <p>CampusFind | College Lost & Found Portal</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
